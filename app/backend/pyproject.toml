[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jump-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "authlib>=1.5,<2",
  "httpx>=0.28,<1",
  "cryptography>=44,<47",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "itsdangerous>=2.2,<3",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["jump"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
