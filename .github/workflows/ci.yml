name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
        working-directory: app/backend
      - run: pytest -q
        working-directory: app/backend
      - run: ruff check . && ruff format --check .
        working-directory: app/backend
      - run: ruff check --config app/backend/pyproject.toml scripts/e2e.py && ruff format --check --config app/backend/pyproject.toml scripts/e2e.py
      - run: python -m compileall -q jump alembic
        working-directory: app/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npm test && npm run typecheck && npm run build
        working-directory: app/frontend

  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [agent, broker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - run: go mod tidy && test -z "$(git status --porcelain)" && go test ./... && go vet ./... && go build ./...
        working-directory: ${{ matrix.component }}
      - run: gofmt -d .; test -z "$(gofmt -l .)"
        working-directory: ${{ matrix.component }}
      - if: matrix.component == 'agent'
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/jump-agent-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -o /tmp/jump-agent-windows-amd64.exe .
        working-directory: agent

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - run: python scripts/e2e.py
